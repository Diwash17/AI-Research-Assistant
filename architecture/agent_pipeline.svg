<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1000" height="280" fill="#ffffff"/>

<text x="500" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#2C2C2A">Multi-Agent Research Pipeline</text>

<!-- Planner -->
<g>
<rect x="30" y="100" width="150" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="105" y="128" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Planner</text>
<text x="105" y="146" text-anchor="middle" font-size="11" fill="#085041">Topic → subtasks</text>
</g>
<line x1="180" y1="135" x2="220" y2="135" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- Research -->
<g>
<rect x="220" y="100" width="150" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="295" y="128" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Research</text>
<text x="295" y="146" text-anchor="middle" font-size="11" fill="#712B13">Tavily search</text>
</g>
<line x1="370" y1="135" x2="410" y2="135" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- Dedup -->
<g>
<rect x="410" y="100" width="150" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="485" y="128" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Dedup</text>
<text x="485" y="146" text-anchor="middle" font-size="11" fill="#085041">Embedding similarity</text>
</g>
<line x1="560" y1="135" x2="600" y2="135" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- Writer -->
<g>
<rect x="600" y="100" width="150" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="675" y="128" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Writer</text>
<text x="675" y="146" text-anchor="middle" font-size="11" fill="#085041">Drafts report</text>
</g>
<line x1="750" y1="135" x2="790" y2="135" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- Reviewer -->
<g>
<rect x="790" y="100" width="150" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="865" y="128" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Reviewer</text>
<text x="865" y="146" text-anchor="middle" font-size="11" fill="#085041">Scores &amp; checks coverage</text>
</g>

<!-- feedback loop -->
<path d="M865 170 C 865 225, 675 225, 675 170" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>
<text x="770" y="245" text-anchor="middle" font-size="11" fill="#444441">revise (max 2 cycles)</text>

<text x="500" y="270" text-anchor="middle" font-size="11" fill="#6b6a66">Output: Markdown + PDF report with inline citations and APA-style references</text>
</svg>
